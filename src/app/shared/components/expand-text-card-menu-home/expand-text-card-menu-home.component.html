<div style="width: 100%">
  <ng-container *ngIf="chipColor">
    <!-- Affichage avec chip -->
    <ion-chip
      (click)="toggleExpand($event)"
      [color]="textColor ? '' : chipColor"
      [style.color]="textColor || 'inherit'"
      style="font-size: 12px; font-weight: bold; margin-left: 0px; color: white"
      class="custom-chip"
      [ngClass]="{ 'expanded-chip': expanded, 'transparent-background': textColor !== '' }"
    >
      <div class="chip-content">
        <ion-icon
          *ngIf="icon"
          [name]="icon"
          [style.color]="iconColor"
          [style.margin-right.px]="expanded ? -10 : 5"
          [style.opacity]="expanded ? 0 : 1"
          [style.transition-duration]="'2s'"
          class="chip-icon"
        ></ion-icon>
        <div
          class="text-container"
          [ngClass]="{ expanded: expanded }"
          [style.height]="expanded ? expandedHeight : '1.5em'"
          [style.width]="expanded && expandWidth ? expandedWidth : collapsedWidth"
          [style.transition]="expandWidth ? 'height 0.7s ease-in-out, width 0.7s ease-in-out' : 'height 0.7s ease-in-out'"
        >
          <ng-container *ngIf="!expanded && !isCollapsing">
            <ion-label #textElement class="truncated-text">{{ truncatedText }}</ion-label>
          </ng-container>
          <ng-container *ngIf="expanded || isCollapsing">
            <ion-label #textElement class="full-text" [ngClass]="{ collapsing: isCollapsing }" [style.white-space]="expandedWhiteSpace">{{ text }}</ion-label>
          </ng-container>
        </div>
      </div>
    </ion-chip>
  </ng-container>

  <ng-container *ngIf="!chipColor">
    <!-- Affichage standard -->
    <div
      class="text-container"
      [ngClass]="{ expanded: expanded, 'no-truncate': !truncate }"
      [style.height]="expanded ? expandedHeight : '1.5em'"
      [style.width]="expanded && expandWidth ? expandedWidth : collapsedWidth"
      [style.transition]="expandWidth ? 'height 0.7s ease-in-out, width 0.7s ease-in-out' : 'height 0.7s ease-in-out'"
      (click)="truncate && toggleExpand($event)"
    >
      <div class="text-content">
        <ion-icon
          *ngIf="icon"
          [name]="icon"
          [style.color]="iconColor"
          [style.margin-right.px]="expanded ? -5 : 5"
          [style.opacity]="expanded ? 0 : 1"
          [style.transition-duration]="'2s'"
          class="chip-icon"
        ></ion-icon>
        <ng-container *ngIf="!expanded && !isCollapsing">
          <ion-label #textElement class="truncated-text" [style.color]="textColor">
            <span *ngIf="label" class="text-label" [style.color]="iconColor">{{ label }}</span>
            {{ truncatedText }}
          </ion-label>
        </ng-container>
        <ng-container *ngIf="expanded || isCollapsing">
          <ion-label #textElement class="full-text" [style.color]="textColor" [ngClass]="{ collapsing: isCollapsing }" [style.white-space]="expandedWhiteSpace">
            <span *ngIf="label" class="text-label" [style.color]="iconColor">{{ label }}</span>
            {{ text }}
          </ion-label>
        </ng-container>
      </div>
    </div>
  </ng-container>
</div>
