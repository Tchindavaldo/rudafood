<div
  (click)="hideCard()"
  id="newFastFood"
  style="
    height: 100%;
    display: flex;
    align-items: center;
    position: absolute;
    top: 0;
    width: 100%;
    justify-content: center;
    background-color: hsl(0deg 0% 0% / 67%);
    backdrop-filter: blur(57px);
  "
>
  <div (click)="$event.stopPropagation()" style="position: absolute; height: 300px; width: 96%; border-radius: 30px; overflow: hidden">
    <ion-card style="position: absolute; z-index: 10000000; background-color: rgb(0 0 0 / 88%); top: 0; backdrop-filter: blur(70px)" class="card-grid">
      <ion-grid fixed class="el">
        <ion-row class="">
          <!-- <ion-col size="auto">
            <ion-label class="text-sm-4 text-md-3 text-lg-2 text-xl-1" style=""
              ><span>Creation du</span><br />Nouveau<br />
              Menu</ion-label
            >
          </ion-col> -->
        </ion-row>
        <ion-row>
          <ion-col size="auto">
            <!-- <ion-label>Statut du menu</ion-label> -->
          </ion-col>
        </ion-row>
        <ion-row>
          <ion-col size="3">
            <div class="ctn-img">
              <div class="img" style="width: 90px; height: 90px; background: #ffffff3b; border-radius: 90px"></div>
            </div>
          </ion-col>
          <ion-col size="9">
            <ion-row>
              <ion-col size="12">
                <ion-input [(ngModel)]="name" class="ion-input" label="Nom Boutique" type="text" label-placement="floating" fill="outline" placeholder="Entrer le  nom de votre boutique">
                </ion-input>
              </ion-col>
              <ion-col size="6">
                <ion-input
                  [(ngModel)]="openTime"
                  class="ion-input"
                  label="Ouverture"
                  type="time"
                  label-placement="floating"
                  fill="outline"
                  placeholder="Entrer l'heure d'ouverture de votre boutique"
                >
                </ion-input>
              </ion-col>

              <ion-col size="6">
                <ion-input
                  [(ngModel)]="closeTime"
                  class="ion-input"
                  label="Fermeture"
                  type="time"
                  label-placement="floating"
                  fill="outline"
                  placeholder="Entrer l'heure de fermeture de votre boutique"
                >
                </ion-input>
              </ion-col>
            </ion-row>
          </ion-col>
        </ion-row>
        <ion-row>
          <ion-col size="12">
            <ion-input
              [(ngModel)]="number"
              class="ion-input"
              label="Numero (OM)"
              type="number"
              label-placement="floating"
              fill="outline"
              placeholder="Entrer le numero de paiment (Orange Money)"
            >
            </ion-input>
          </ion-col>

          <!-- <ion-col size="4">

        </ion-col>
      </ion-row> -->
        </ion-row>

          </ion-col>

        <ion-row style="justify-content: flex-end" class="row-btn-nav">
          <ion-col size="auto">
            <ion-chip class="chip" color="danger">
              <ion-icon name="options"> </ion-icon>

              <ion-label> Annuler </ion-label>
            </ion-chip>
          </ion-col>
          <ion-col class="col-btn-connect" size="auto">
            <ion-chip (click)="postfastFood()" class="chip" color="danger">
              <ion-icon [ngStyle]="{ visibility: !isPosting || isError ? 'visible' : 'hidden' }" name="options"></ion-icon>
              <ion-label [ngStyle]="{ visibility: !isPosting || isError ? 'visible' : 'hidden' }">Creer</ion-label>

              <app-loader fillColor="white" [load]="isPosting && !isError"></app-loader>
            </ion-chip>

          </ion-col>
        </ion-row>
      </ion-grid>
    </ion-card>
    <!-- <ion-card class="card-black"> </ion-card> -->
    <ion-card style="position: absolute; z-index: 100; background: linear-gradient(45deg, #ff0000, #ffffff); height: 100%" class="el card-back"> </ion-card>

    <!-- <ion-card style="position: absolute; z-index: 100; background: darkred" class="el card-back2"> </ion-card> -->
  </div>
</div>
