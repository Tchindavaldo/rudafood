<app-loader [load]="pendingToBuyOrder === undefined"></app-loader>

<!-- <div style="position: relative; width: 100%; height: 100%" > -->
<!-- pending order to buy -->
<ion-list style="background: none; padding-bottom: 85px" class="date-card" *ngIf="pendingToBuyOrder !== undefined">
  <ion-card *ngFor="let order of pendingToBuyOrder; trackBy: trackByOrderId" class="section-card">
    <ion-card-content>
      <ion-item-group class="user-group">
        <app-fast-food-order
          extraColor=""
          [background]="'none'"
          chipColor="default"
          textColor="black"
          [extras]="order.extra || []"
          [extrasDrink]="order.drink || []"
          [order]="order"
          procededAction="processing"
          showedAction="valider"
          [truncateDeliveryAddress]="true"
          [maxLengthDeliveryLocation]="25"
          [showOrderCount]="true"
          [updateOrderFunc]="updateOrder.bind(this)"
        ></app-fast-food-order>
      </ion-item-group>
    </ion-card-content>
  </ion-card>
</ion-list>
