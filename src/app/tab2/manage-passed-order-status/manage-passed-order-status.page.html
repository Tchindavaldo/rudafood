<ion-header>
  <ion-toolbar>
    <ion-grid fixed>
      <ion-row class="firstRow">
        <ion-col size="12">
          <app-component0 marginGrid="0"></app-component0>
        </ion-col>
      </ion-row>
      <ion-row>
        <ion-col size="12">
          <ion-label>aujourd'hui</ion-label>
          <ion-label>02 AOUT 2024</ion-label>
        </ion-col>
      </ion-row>
      <ion-row class="rowPrixCmd">
        <ion-col size="6">
          <app-component1></app-component1>
        </ion-col>
        <ion-col size="6">
          <app-component1 text1="18000" text2="fcfa" text3="Montant Total"></app-component1>
        </ion-col>
      </ion-row>

      <ion-row class="rowNavGestionChipNav">
        <ion-row class="rowNavGestionCmd" id="rowActionGestionCmd">
          <ion-col size="auto">
            <ion-chip color="danger" [routerLink]="['user-pending-order']">
              <ion-label>Cmds en Attente</ion-label>
            </ion-chip>
          </ion-col>
          <ion-col size="auto">
            <ion-chip color="danger" [routerLink]="['user-proccessing-order']">
              <ion-label>Cmds en cours</ion-label>
            </ion-chip>
          </ion-col>
          <ion-col size="auto">
            <ion-chip color="danger" [routerLink]="['user-finished-order']">
              <ion-label>Cmds en Terminer</ion-label>
            </ion-chip>
          </ion-col>
        </ion-row>
      </ion-row>
    </ion-grid>
  </ion-toolbar>
</ion-header>

<!-- Affichage du loader tant que orderData.getUserOrders() est en attente -->
<app-loader [load]="(orderData.getUserOrders() ) === null" height="100%"></app-loader>

<!-- Affichage du contenu lorsque orderData.getUserOrders() est différent de null -->
<!-- [@orderData.getUserOrders()RouteAnimation]="getAnimationData(outlet)"  [@orderData.getUserOrders()RouteNoAnimation]="getAnimationData(outlet) === 'user-pending-order-NoAnim'" -->

<ion-content
  *ngIf="(orderData.getUserOrders() ) !== null"
  style="height: 500px"
  [@userOrderRouteAnimation]="getAnimationData(outlet) !== 'user-pending-order-NoAnim' ? getAnimationData(outlet) : undefined"
>
  <router-outlet #outlet="outlet" />
</ion-content>
