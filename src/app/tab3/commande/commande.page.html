<ion-header>
  <ion-toolbar>
    <ion-grid fixed>
      <ion-row class="firstRow">
        <ion-col size="12">
          <app-component0 marginGrid="0"></app-component0>
        </ion-col>
      </ion-row>
      <ion-row>
        <ion-col size="12">
          <ion-label>aujourd'hui</ion-label>
          <ion-label>02 AOUT 2024</ion-label>
        </ion-col>
      </ion-row>
      <ion-row class="rowPrixCmd">
        <ion-col size="6">
          <app-component1></app-component1>
        </ion-col>
        <ion-col size="6">
          <app-component1 text1="18000" text2="fcfa" text3="Montant Total"></app-component1>
        </ion-col>
      </ion-row>

      <ion-row class="rowNavGestionChipNav">
        <ion-row class="rowNavGestionCmd" id="rowActionGestionCmd">
          <ion-col size="auto">
            <ion-chip color="danger" [routerLink]="['/tabs/tab3/commande/pending']">
              <ion-label>Cmds en Attente</ion-label>
            </ion-chip>
          </ion-col>
          <ion-col size="auto">
            <ion-chip color="danger" [routerLink]="['/tabs/tab3/commande/proccess']">
              <ion-label>Cmds en cours</ion-label>
            </ion-chip>
          </ion-col>
          <ion-col size="auto">
            <ion-chip color="danger" [routerLink]="['/tabs/tab3/commande/finish']">
              <ion-label>Cmds en Terminer</ion-label>
            </ion-chip>
          </ion-col>
        </ion-row>
      </ion-row>
    </ion-grid>
  </ion-toolbar>
</ion-header>

<ion-content>
  <app-loader [load]="this.orderData.getFastfoodOrders() === null" height="65%"></app-loader>

  <!-- Affichage du contenu lorsque fastFoodOrder est différent de null -->
  <main
    *ngIf="this.orderData.getFastfoodOrders() !== null"
    style="height: 500px"
    [@fastFoodOrderRouteAnimation]="getAnimationData(outlet) !== 'pending-noAnim' ? getAnimationData(outlet) : undefined"
  >
    <router-outlet #outlet="outlet" [@.disabled]="false"></router-outlet>
  </main>
</ion-content>
