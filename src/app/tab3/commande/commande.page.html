<ion-header *ngIf="userData.fastFoodId!==undefined" style="position: sticky; top: -130px; z-index: 5000">
  <ion-toolbar>
    <ion-grid fixed>
      <ion-row style="display: flex; justify-content: space-between; margin-bottom: 7px">
        <ion-col style="flex-direction: column; display: flex; align-items: flex-start" size="5">
          <ion-label style="font-size: 18px; white-space: nowrap">{{ getRelativeDate(selectedDate) | titlecase }}</ion-label>
          <ion-label style="margin-left: 0px; font-size: 14px">{{ currentDate }}</ion-label>
        </ion-col>
        <ion-col *ngIf="nextDays.length>0" size="7" style="display: flex; align-items: center; overflow-x: auto; white-space: nowrap">
          <!-- Afficher les dates avec des commandes -->
          <ng-container *ngFor="let day of nextDays.slice(0,7)">
            <ion-col size="auto" (click)="selectDay(day)" class="day-col">
              <app-component2
                [backgrd]="isSameDay(selectedDate, day.fullDate) ? 'darkred' : '#fff5f5'"
                [mLeft]="'5px'"
                [shadow]="isSameDay(selectedDate, day.fullDate) ? '0px 0px 8px 0px darkred' : 'none'"
                [text1]="day.day"
                [text2]="day.date.toString()"
                [style.opacity]="isSameDay(selectedDate, day.fullDate) ? '1' : '0.6'"
                [color1]="isSameDay(selectedDate, day.fullDate) ? 'white' : 'black'"
                [color2]="isSameDay(selectedDate, day.fullDate) ? 'white' : 'black'"
              ></app-component2>
            </ion-col>
          </ng-container>

          <!-- Bouton de sélection de date -->
          <!-- <ion-col size="auto" class="see-more-col">
            <ion-icon name="add" style="font-size: 24px; color: var(--ion-color-primary)"></ion-icon>
          </ion-col> -->

          <!-- Modal pour la sélection de date -->
        </ion-col>
      </ion-row>
      <ion-row class="rowPrixCmd">
        <ion-col size="6">
          <app-component1 [text1]="totalOrder.toString()"></app-component1>
        </ion-col>
        <ion-col size="6">
          <app-component1 [text1]="totalAmount.toString()" text2="fcfa" text3="Montant Total"></app-component1>
        </ion-col>
      </ion-row>

      <ion-row class="rowNavGestionChipNav" style="height: 20px; margin: 10px 0 20px 0">
        <ion-row class="rowNavGestionMenu" id="rowActionGestionMenu">
          <ion-col size="auto">
            <ion-chip color="danger" [class.selected]="isSelected('pending')" routerLink="pending" (click)="selectChip('pending')">
              <ion-icon name="time-outline"></ion-icon>
              <ion-label>Cmds en Attente</ion-label>
              <ion-label style="font-size: 12px; font-weight: 900; margin-left: 5px">({{totalPendingOrder.toString()}})</ion-label>
            </ion-chip>
          </ion-col>
          <ion-col size="auto">
            <ion-chip color="danger" [class.selected]="isSelected('proccess')" routerLink="proccess" (click)="selectChip('proccess')">
              <ion-icon name="restaurant-outline"></ion-icon>
              <ion-label>Cmds en cours</ion-label>
              <ion-label style="font-size: 12px; font-weight: 900; margin-left: 5px">({{totalProcessingOrder.toString()}})</ion-label>
            </ion-chip>
          </ion-col>
          <ion-col size="auto">
            <ion-chip color="danger" [class.selected]="isSelected('finish')" routerLink="finish" (click)="selectChip('finish')">
              <ion-icon name="checkmark-done-outline"></ion-icon>
              <ion-label>Cmds en Terminer</ion-label>
              <ion-label style="font-size: 12px; font-weight: 900; margin-left: 5px">({{totalFinishedOrder.toString()}})</ion-label>
            </ion-chip>
          </ion-col>
        </ion-row>
      </ion-row>
      <ion-row *ngIf="(selectedChip === 'pending' && PassPendingDays.length > 0) ||
                  (selectedChip === 'proccess' && PassProcessingDays.length > 0) ||
                  (selectedChip === 'finish' && PassFinishedDays.length > 0)">
        <ion-col size="12" style="display: flex; align-items: center; overflow-x: auto; white-space: nowrap">
          <ion-label style="color: #666; margin-right: 10px; font-size: 14px">
            Jours Précédents <br />
            Commandes {{previousDaysLabel}}
          </ion-label>
          
          <ng-container *ngIf="selectedChip === 'pending'">
            <ng-container *ngFor="let day of PassPendingDays">
              <ion-col size="auto" (click)="selectDay(day)" class="day-col">
                <app-component2
                  [backgrd]="isSameDay(selectedDate, day.fullDate) ? 'darkred' : '#fff5f5'"
                  [mLeft]="'5px'"
                  [shadow]="isSameDay(selectedDate, day.fullDate) ? '0px 0px 8px 0px darkred' : 'none'"
                  [text1]="day.day"
                  [text2]="day.date.toString()"
                  [style.opacity]="isSameDay(selectedDate, day.fullDate) ? '1' : '0.6'"
                  [color1]="isSameDay(selectedDate, day.fullDate) ? 'white' : 'black'"
                  [color2]="isSameDay(selectedDate, day.fullDate) ? 'white' : 'black'">
                </app-component2>
              </ion-col>
            </ng-container>
          </ng-container>

          <ng-container *ngIf="selectedChip === 'proccess'">
            <ng-container *ngFor="let day of PassProcessingDays">
              <ion-col size="auto" (click)="selectDay(day)" class="day-col">
                <app-component2
                  [backgrd]="isSameDay(selectedDate, day.fullDate) ? 'darkred' : '#fff5f5'"
                  [mLeft]="'5px'"
                  [shadow]="isSameDay(selectedDate, day.fullDate) ? '0px 0px 8px 0px darkred' : 'none'"
                  [text1]="day.day"
                  [text2]="day.date.toString()"
                  [style.opacity]="isSameDay(selectedDate, day.fullDate) ? '1' : '0.6'"
                  [color1]="isSameDay(selectedDate, day.fullDate) ? 'white' : 'black'"
                  [color2]="isSameDay(selectedDate, day.fullDate) ? 'white' : 'black'">
                </app-component2>
              </ion-col>
            </ng-container>
          </ng-container>

          <ng-container *ngIf="selectedChip === 'finish'">
            <ng-container *ngFor="let day of PassFinishedDays">
              <ion-col size="auto" (click)="selectDay(day)" class="day-col">
                <app-component2
                  [backgrd]="isSameDay(selectedDate, day.fullDate) ? 'darkred' : '#fff5f5'"
                  [mLeft]="'5px'"
                  [shadow]="isSameDay(selectedDate, day.fullDate) ? '0px 0px 8px 0px darkred' : 'none'"
                  [text1]="day.day"
                  [text2]="day.date.toString()"
                  [style.opacity]="isSameDay(selectedDate, day.fullDate) ? '1' : '0.6'"
                  [color1]="isSameDay(selectedDate, day.fullDate) ? 'white' : 'black'"
                  [color2]="isSameDay(selectedDate, day.fullDate) ? 'white' : 'black'">
                </app-component2>
              </ion-col>
            </ng-container>
          </ng-container>
        </ion-col>
      </ion-row>
    </ion-grid>
  </ion-toolbar>
</ion-header>
