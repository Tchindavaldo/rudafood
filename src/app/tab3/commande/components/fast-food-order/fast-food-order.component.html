<div style="overflow: hidden; border-radius: 18px; margin-bottom: 26px">
  <ion-item [ngStyle]="itemStyle" (click)="hideExtrasPanel(order.id)">
    <ion-grid>
      <ion-row style="margin: 0px 2px 35px; justify-content: space-between">
        <!-- Afficher les extras limités au nombre maximal défini -->
        <ion-col size="9">
          <!-- <ion-col size="2.75" *ngFor="let extra of extrasToShow">
          <ion-chip (click)="showAllExtras()"  >
            <ion-label>{{ extra.name }}</ion-label>
            <div class="custom-checkbox" [ngClass]="{ 'cross-checkbox': !extra.status, 'check-checkbox': extra.status }">
              <ion-icon *ngIf="!extra.status" name="close" class="icon-symbol"></ion-icon>
              <ion-icon *ngIf="extra.status" name="checkmark" class="icon-symbol"></ion-icon>
            </div>
          </ion-chip>
        </ion-col> -->

          <ion-col size="auto">
            <ion-chip
              (click)="resetPanels()"
              style="font-size: 10px; font-weight: bold; margin-left: 0px; transition: all 0.5s ease; transform: scale(0.95)"
              [color]="!isExtrasPanelVisible && !isDrinkPanelVisible ? 'success' : 'light'"
              [ngClass]="{ 'chip-active': !isExtrasPanelVisible && !isDrinkPanelVisible }"
              [ngStyle]="textColor !== '' ? { color: textColor } : {}"
            >
              <ion-icon name="restaurant-outline"></ion-icon>
              <ion-label> Menu </ion-label>
            </ion-chip>
          </ion-col>

          <ion-col size="auto" *ngIf="extrasToShow.length > 0">
            <ion-chip
              (click)="hideExtrasPanel(order.id); toggleExtrasPanel($event, order.id + '-extra'); extraVisited()"
              style="font-size: 10px; font-weight: bold; margin-left: 0px; transition: all 0.5s ease; transform: scale(0.95)"
              [color]="isExtrasPanelVisible ? 'success' : 'light'"
              [ngClass]="{ 'chip-active': isExtrasPanelVisible }"
              [ngStyle]="textColor !== '' ? { color: textColor } : {}"
            >
              <ion-icon name="fast-food-outline"></ion-icon>
              <ion-label> Extras +{{ extrasToShow.length }} </ion-label>
            </ion-chip>
          </ion-col>

          <ion-col size="auto" *ngIf="extrasDrink.length > 0">
            <ion-chip
              (click)="hideExtrasPanel(order.id); toggleExtrasPanel($event, order.id + '-drink'); drinkVisited()"
              style="font-size: 10px; font-weight: bold; margin-left: 0px; transition: all 0.5s ease; transform: scale(0.95)"
              [color]="isDrinkPanelVisible ? 'success' : 'light'"
              [ngClass]="{ 'chip-active': isDrinkPanelVisible }"
              [ngStyle]="textColor !== '' ? { color: textColor } : {}"
            >
              <ion-icon name="beer-outline"></ion-icon>
              <ion-label> Boisson +{{ extrasDrink.length }} </ion-label>
            </ion-chip>
          </ion-col>
        </ion-col>

        <!-- Afficher l'indicateur "+X éléments en plus" si nécessaire -->
        <!-- <ion-col style="align-items: center" size="1" *ngIf="hasAdditionalExtras">
        <ion-label (click)="showAllExtras()" style="font-size: 14px; font-weight: bold; cursor: pointer">+{{ additionalExtrasCount }} </ion-label>
      </ion-col> -->

        <ion-col style="align-items: center" size="auto">
          <ion-col *ngIf="order.status === 'processing'">
            <ion-button
              (click)="backOrder()"
              fill="solid"
              shape="round"
              size="small"
              style="--border-radius: 50%; width: 30px; height: 30px; --padding-start: 0; --padding-end: 0; --background: #8b0000; --background-activated: #ff0000"
              [disabled]="isBackOrder"
            >
              <ion-icon name="arrow-back-outline" style="font-size: 16px" *ngIf="!isBackOrder"></ion-icon>
              <ion-spinner name="crescent" style="font-size: 16px" *ngIf="isBackOrder"></ion-spinner>
            </ion-button>
          </ion-col>

          <ion-col *ngIf="order.status === 'processing' || order.status === 'pending' || order.status === 'pendingToBuy'">
            <ion-button
              (click)="showConfirmCancelOrder(order.status + order.id)"
              fill="solid"
              shape="round"
              size="small"
              style="--border-radius: 50%; width: 30px; height: 30px; --padding-start: 0; --padding-end: 0; --background: rgba(236,73,19,1.00); --background-activated: red"
            >
              <ion-icon name="close-outline" style="font-size: 16px"></ion-icon>
            </ion-button>
          </ion-col>
        </ion-col>
      </ion-row>

      <div>
        <ion-row class="main-content" [ngClass]="{ 'content-visible': !isExtrasPanelVisible && !isDrinkPanelVisible, 'content-hidden': isExtrasPanelVisible || isDrinkPanelVisible }">
          <ion-col size="10">
            <app-expandable-text [text]="(order.total || noDef) + ' 500fcfa'" [maxLength]="250" [icon]="'wallet-outline'" [chipColor]="chipColor" [truncate]="true" [textColor]="textColor">
            </app-expandable-text>
          </ion-col>
        </ion-row>
        <ion-row
          class="main-content"
          [ngClass]="{ 'content-visible': !isExtrasPanelVisible && !isDrinkPanelVisible, 'content-hidden': isExtrasPanelVisible || isDrinkPanelVisible }"
          style="flex-wrap: nowrap; justify-content: space-between; margin-bottom: 0"
        >
          <ion-col size="9">
            <ion-grid fixed>
              <ion-row>
                <ion-col size="7" style="display: block">
                  <!-- Utilisation du composant expandable-text pour le nom du menu -->
                  <app-expandable-text [text]="logText" [maxLength]="25" [icon]="'restaurant-outline'" [chipColor]="chipColor" [truncate]="true" [textColor]="textColor">
                  </app-expandable-text>
                </ion-col>
              </ion-row>
              <ion-row style="justify-content: space-between">
                <ion-col size="12">
                  <!-- Utilisation du composant expandable-text pour l'adresse de livraison -->
                  <app-expandable-text
                    [textColor]="textColor"
                    [text]="order.delivery?.location || 'Quartier Nkomo, après le marché central, à côté de la pharmacie du soleil, immeuble bleu à 3 étages, 2ème étage, porte 204'"
                    [maxLength]="maxLengthDeliveryLocation"
                    [icon]="'navigate-outline'"
                    [iconColor]="'red'"
                    [label]="'Livraison:'"
                    [truncate]="truncateDeliveryAddress"
                  >
                  </app-expandable-text>
                </ion-col>
              </ion-row>
            </ion-grid>
          </ion-col>
          <ion-col size="auto" style="display: flex; justify-content: space-between" *ngIf="!showOrderCount">
            <div class="ctn-add">
              <ion-chip (click)="validateOrder()" style="background-color: black; font-size: 10px; font-weight: bold; color: white; letter-spacing: 1.1px; margin-bottom: 0; margin-right: 0">
                <app-loader *ngIf="order.status !== 'finished'" [strokeWidth]="8" stokeColor="white" fillColor="white" [load]="isUpdating"></app-loader>
                <div style="display: flex; flex-direction: column; align-items: center">
                  <ion-label *ngIf="order.status !== 'finished'" [ngStyle]="{ visibility: isUpdating ? 'hidden' : 'visible' }" class="nbre-item"> {{ showedAction }} </ion-label>
                  <ion-icon *ngIf="order.status === 'finished'" name="notifications" style="color: white; font-size: 16px"></ion-icon>
                </div>
              </ion-chip>
            </div>
          </ion-col>

          <ion-col size="auto" *ngIf="showOrderCount" style="display: block; margin-top: auto; margin-bottom: 0">
            <ion-chip color="danger" class="chip-active" style="margin-bottom: 0">
              <ion-icon name="remove-circle" (click)="decreaseQuantity()"></ion-icon>
              <ion-label> {{ order?.quantity || 1 }} </ion-label>
              <ion-icon name="add-circle" (click)="increaseQuantity()"></ion-icon>
            </ion-chip>
          </ion-col>
        </ion-row>
      </div>
    </ion-grid>

    <!-- Panneau latéral des extras -->
    <app-extras-panel [orderId]="order.id + '-extra'" [extras]="extrasToShow" [isCheckable]="false" [color]="extraColor"></app-extras-panel>
    <app-extras-panel [orderId]="order.id + '-drink'" [extras]="extrasDrink" [isCheckable]="false" [color]="extraColor"></app-extras-panel>
    <app-confirm-procesing-order
      *ngIf="order.status === 'processing' || order.status === 'pending' || order.status === 'pendingToBuy'"
      [data]="order"
      [modalId]="order.status + order.id"
    ></app-confirm-procesing-order>
  </ion-item>
</div>
