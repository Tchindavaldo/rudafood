<ion-item [style]="itemStyle">
  <ion-grid>
    <ion-row style="margin: 0px 2px 35px; justify-content: space-between">
      <!-- Afficher les extras limités au nombre maximal défini -->
      <ion-col size="auto">
        <!-- <ion-col size="2.75" *ngFor="let extra of extrasToShow">
          <ion-chip (click)="showAllExtras()"  >
            <ion-label>{{ extra.name }}</ion-label>
            <div class="custom-checkbox" [ngClass]="{ 'cross-checkbox': !extra.status, 'check-checkbox': extra.status }">
              <ion-icon *ngIf="!extra.status" name="close" class="icon-symbol"></ion-icon>
              <ion-icon *ngIf="extra.status" name="checkmark" class="icon-symbol"></ion-icon>
            </div>
          </ion-chip>
        </ion-col> -->

        <ion-col size="auto">
          <ion-chip style="font-size: 10px; font-weight: bold; margin-left: 0px" color="light">
            <ion-icon name="fast-food-outline"></ion-icon>
            <ion-label> Extras +4 </ion-label>
          </ion-chip>
        </ion-col>

        <ion-col size="auto">
          <ion-chip style="font-size: 10px; font-weight: bold; margin-left: 0px" color="light">
            <ion-icon name="beer-outline"></ion-icon>
            <ion-label> Boisson +5 </ion-label>
          </ion-chip>
        </ion-col>
      </ion-col>

      <!-- Afficher l'indicateur "+X éléments en plus" si nécessaire -->
      <!-- <ion-col style="align-items: center" size="1" *ngIf="hasAdditionalExtras">
        <ion-label (click)="showAllExtras()" style="font-size: 14px; font-weight: bold; cursor: pointer">+{{ additionalExtrasCount }} </ion-label>
      </ion-col> -->

      <ion-col style="align-items: center" size="auto" *ngIf="hasAdditionalExtras">
        <ion-chip (click)="showConfirmCancelOrder(order.id)" color="danger" style="background-color: darkred; color: white; font-size: 10px; font-weight: bold">
          <ion-label> Annuler </ion-label>
          <ion-icon name="close-circle-outline"></ion-icon>
        </ion-chip>
      </ion-col>
    </ion-row>

    <ion-row>
      <ion-col size="10">
        <ion-chip style="font-size: 12px; font-weight: bold; margin-left: 0px" color="success">
          <ion-icon name="wallet-outline" style="margin-right: 5px"></ion-icon>
          <ion-label class="NomCmdUser">{{ order.total || noDef }} fcfa</ion-label>
        </ion-chip>
      </ion-col>
    </ion-row>
    <ion-row style="flex-wrap: nowrap; overflow-x: scroll; justify-content: space-between; margin-bottom: 0">
      <ion-col size="9">
        <ion-grid fixed>
          <ion-row>
            <ion-col size="7" style="display: block">
              <!-- Utilisation du composant expandable-text pour le nom du menu -->
              <app-expandable-text [text]="logText" [maxLength]="30" [icon]="'restaurant-outline'" [chipColor]="'success'" [truncate]="true"> </app-expandable-text>
            </ion-col>
          </ion-row>
          <ion-row>
            <ion-col size="12">
              <!-- Utilisation du composant expandable-text pour l'adresse de livraison -->
              <app-expandable-text
                [text]="order.delivery?.location || 'Quartier Nkomo, après le marché central, à côté de la pharmacie du soleil, immeuble bleu à 3 étages, 2ème étage, porte 204'"
                [maxLength]="40"
                [icon]="'navigate-outline'"
                [iconColor]="'red'"
                [label]="'Livraison:'"
                [truncate]="truncateDeliveryAddress"
              >
              </app-expandable-text>
            </ion-col>
          </ion-row>
        </ion-grid>
      </ion-col>
      <ion-col size="auto" style="display: flex; justify-content: space-between">
        <div class="ctn-add">
          <ion-chip (click)="validateOrder()" style="background-color: black; font-size: 10px; font-weight: bold; color: white; letter-spacing: 1.1px; margin-bottom: 0; margin-right: 0">
            <app-loader *ngIf="order.status !== 'finished'" [strokeWidth]="8" stokeColor="white" fillColor="white" [load]="isUpdating"></app-loader>
            <div style="display: flex; flex-direction: column; align-items: center">
              <ion-label *ngIf="order.status !== 'finished'" [ngStyle]="{ visibility: isUpdating ? 'hidden' : 'visible' }" class="nbre-item"> {{ showedAction }} </ion-label>
              <ion-icon *ngIf="order.status === 'finished'" name="notifications" style="color: white; font-size: 16px"></ion-icon>
            </div>
          </ion-chip>
        </div>
      </ion-col>
    </ion-row>
  </ion-grid>
  <app-confirm-procesing-order [data]="order" [modalId]="order.id"></app-confirm-procesing-order>
</ion-item>
