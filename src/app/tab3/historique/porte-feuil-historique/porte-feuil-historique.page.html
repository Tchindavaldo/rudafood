<ion-item>
  <ion-grid>
    <ion-row>
      <ion-col>
        <ion-label>{{transaction.createdAt | date: 'EEEE d MMMM y'}}</ion-label>
      </ion-col>
    </ion-row>
    <ion-row>
      <ion-col size="7"><ion-label> Transaction </ion-label></ion-col>
      <ion-col size="5">{{transaction.name}}</ion-col>
    </ion-row>
    <ion-row>
      <ion-col size="7"><ion-label>Montant</ion-label></ion-col>
      <ion-col size="5"><ion-label>{{transaction.amount}}f</ion-label></ion-col>
    </ion-row>
    <!-- <ion-row>
      <ion-col size="7"><ion-label>Nouveau solde</ion-label></ion-col>
      <ion-col size="5"><ion-label>1750f</ion-label></ion-col>
    </ion-row> -->
    <ion-row>
      <ion-col size="7"><ion-label>Paye par</ion-label></ion-col>
      <ion-col size="5"><ion-label>{{transaction.payBy}}</ion-label></ion-col>
    </ion-row>
  </ion-grid>
</ion-item>
