<ion-header>
  <ion-toolbar>
    <ion-card>
      <ion-grid>
        <ion-row class="row-montant">
          <ion-col style="display: flex; flex-direction: column" size="auto">
            <ion-col size="auto">
              <ion-label class="lable-amount"> Solde </ion-label>
            </ion-col>
            <ion-col size="auto" class="val-montant">
              <ion-label> {{totalAmountAccount}} f</ion-label>
            </ion-col>
          </ion-col>
          <ion-col style="display: flex; flex-direction: column; margin-left: 15px" size="auto">
            <ion-col size="auto">
              <ion-label class="lable-amount"> Depense </ion-label>
            </ion-col>
            <ion-col size="auto" class="val-montant">
              <ion-label> {{totalAmountSpend}} f</ion-label>
            </ion-col>
          </ion-col>
        </ion-row>

        <ion-row class="row-sgement">
          <ion-col>
            <ion-grid>
              <ion-row>
                <ion-col class="col-segment" size="3">
                  <ion-col size="auto" color="light">
                    <ion-icon size="5" name="options"> </ion-icon>
                  </ion-col>
                  <ion-col class="label-sgement" size="12" color="light">
                    <ion-label> DEPOT </ion-label>
                  </ion-col>
                </ion-col>
                <ion-col class="col-segment" size="3">
                  <ion-col size="12" color="light">
                    <ion-icon name="options"> </ion-icon>
                  </ion-col>
                  <ion-col class="label-sgement" size="12" color="light">
                    <ion-label> RETRAIT </ion-label>
                  </ion-col>
                </ion-col>
                <ion-col class="col-segment" size="3">
                  <ion-col size="12" color="light">
                    <ion-icon name="options"> </ion-icon>
                  </ion-col>
                  <ion-col class="label-sgement" size="12" color="light">
                    <ion-label> TRANSFERT </ion-label>
                  </ion-col>
                </ion-col>
                <ion-col class="col-segment" size="3">
                  <ion-col size="12" color="light">
                    <ion-icon name="options"> </ion-icon>
                  </ion-col>
                  <ion-col class="label-sgement" size="12" color="light">
                    <ion-label> HISTORIQUE </ion-label>
                  </ion-col>
                </ion-col>
              </ion-row>
            </ion-grid>
          </ion-col>
        </ion-row>
      </ion-grid>
    </ion-card>
  </ion-toolbar>
</ion-header>

<ion-content [scrollX]="true" [fullscreen]="true">
  <ion-infinite-scroll>
    <ion-list>
      <app-porte-feuil-historique></app-porte-feuil-historique>
      <app-porte-feuil-historique></app-porte-feuil-historique>
    </ion-list>
  </ion-infinite-scroll>
</ion-content>
