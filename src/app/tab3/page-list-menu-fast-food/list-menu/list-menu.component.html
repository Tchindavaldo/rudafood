<ion-content>
  <ion-list>
    <app-menu-item-list [menu]="menu" iconName="options" *ngFor="let menu of menuTab | async; trackBy: trackByFn"></app-menu-item-list>
  </ion-list>
  <ion-button *ngIf="(menuTab | async)?.length !== 0" (click)="redirect('tabs/tab3/menu/new-menu')"> <ion-icon name="add"></ion-icon></ion-button>
</ion-content>
