<ion-header style="position: sticky; top: 0; z-index: 10500">
  <ion-toolbar>
    <ion-grid fixed>
      <!-- <ion-row class="firstRow">
        <ion-col size="12">
          <app-component0 marginGrid="0"></app-component0>
        </ion-col>
      </ion-row> -->
      <ion-row>
        <ion-col size="12"> <ion-label style="font-size: 18px">aujourd'hui</ion-label><ion-label style="margin-left: 10px; font-size: 14px">{{ currentDate }}</ion-label> </ion-col>
      </ion-row>
      <ion-row class="rowPrixCmd">
        <ion-col size="4">
          <app-component1 text1="{{ totalMenus }}" text2="" text3="Menu total"></app-component1>
        </ion-col>
        <ion-col size="4">
          <app-component1 text1="{{ availableMenus }}" text2="" text3="Menu disponible"></app-component1>
        </ion-col>
        <ion-col size="4">
          <app-component1 text1="{{ unavailableMenus }}" text2="" text3="Menu indisponible"></app-component1>
        </ion-col>
      </ion-row>
      <!-- <ion-row class="RowNavGestion">
        <ion-col class="colNavGestion" size="auto">
          <app-component2 color1="rgb(255 255 255 / 89%)" mLeft="12px" color2="white"></app-component2>
        </ion-col>
        <ion-col class="colNavGestion" size="auto">
          <app-component2 backgrd="#fff5f5" mLeft="5px" shadow="none" text1="MAR" text2="13"></app-component2>
        </ion-col>
      </ion-row> -->
      <ion-row class="rowNavGestionChipNav">
        <ion-row class="rowNavGestionMenu" id="rowActionGestionMenu">
          <ion-col size="auto">
            <ion-chip color="danger" [class.selected]="isSelected('menu')" routerLink="list" (click)="selectChip('menu')">
              <ion-icon name="calendar"></ion-icon>
              <ion-label>Menu Du jour</ion-label>
            </ion-chip>
          </ion-col>
          <ion-col size="auto">
            <ion-chip color="danger" [class.selected]="isSelected('dispo')" routerLink="disponibilite" (click)="selectChip('dispo')">
              <ion-icon name="checkmark-circle"></ion-icon>
              <ion-label>Disponibilite</ion-label>
            </ion-chip>
          </ion-col>
          <ion-col size="auto">
            <ion-chip color="danger" [class.selected]="isSelected('modif')" routerLink="modification" (click)="selectChip('modif')">
              <ion-icon name="create"></ion-icon>
              <ion-label>Modification</ion-label>
            </ion-chip>
          </ion-col>
          <ion-col size="auto">
            <ion-chip color="danger" [class.selected]="isSelected('supp')" routerLink="suppression" (click)="selectChip('supp')">
              <ion-icon name="trash"></ion-icon>
              <ion-label>Suppression</ion-label>
            </ion-chip>
          </ion-col>
        </ion-row>
      </ion-row>
    </ion-grid>
  </ion-toolbar>
</ion-header>
<router-outlet *ngIf="(menuTab | async)?.length !== 0"></router-outlet>
<app-loader [load]="isLoading" height="100%"></app-loader>
<app-text-action
  *ngIf="(menuTab | async)?.length === 0"
  title="Vous n'avez aucun menu "
  subtitle="creer votre menu"
  buttonText="Creer"
  (click)="redirect('tabs/tab3/menu/new-menu')"
></app-text-action>
