<ion-col style="display: flex">
  <ion-card class="ion-card">
    <ion-grid>
      <ion-row>
        <ion-col>
          <ion-grid>
            <ion-row class="row-titre">
              <ion-col>
                <ion-label class="titre"> {{ menu.name }} </ion-label>
              </ion-col>
            </ion-row>
            <ion-row style="display: block">
              <ion-col class="statut" size="auto">
                <ion-label [ngStyle]="{ 'background-color': menu.status === 'available' ? 'green' : 'red', color: 'white' }" class="status-chip">{{
                  menu.status === 'available' ? 'Disponible' : 'Indisponible'
                }}</ion-label>
              </ion-col>
            </ion-row>
            <ion-row class="row-prix-temps">
              <ion-col class="prix">
                <ion-label> {{ menu?.prices && menu.prices.length > 0 ? menu.prices[0].price : '' }} fcfa </ion-label>
              </ion-col>
              <!-- <ion-col class="temps">
                <ion-label> 15-20min </ion-label>
              </ion-col> -->
            </ion-row>
          </ion-grid>
        </ion-col>
        <ion-col>
          <ion-card class="card-img-food">
            <div class="skeleton" *ngIf="!menu.coverImage || isLoading"></div>
            <img style="width: 100%; height: 100%; object-fit: cover" [src]="menu.coverImage" (error)="onImageError($event)" alt="Menu image" (load)="onImageLoad($event)" />
          </ion-card>
        </ion-col>
      </ion-row>
    </ion-grid>
  </ion-card>
</ion-col>
