<ion-col style="display: flex">
  <ion-grid style="padding: 0">
    <ion-row>
      <ion-col size="auto">
        <ion-card class="imageFood">
          <div class="skeleton" *ngIf="!menu.coverImage || isLoading"></div>
          <img style="width: 100%; height: 100%; object-fit: cover" [src]="menu.coverImage" (error)="onImageError($event)" alt="Menu image" (load)="onImageLoad($event)" />
        </ion-card>
      </ion-col>
      <ion-col class="col-infos" size="auto">
        <ion-grid class="grid-infos">
          <ion-row>
            <ion-col size="auto" class="ligne-titre">
              <ion-label class="titre"> {{ menu.name }} </ion-label>
            </ion-col>
          </ion-row>

          <ion-row>
            <ion-col size="auto" class="ligne-statut">
              <ion-label class="prix"> {{ menu?.prices && menu.prices.length > 0 ? menu.prices[0].price : '' }} fcfa </ion-label>
            </ion-col>
          </ion-row>

          <ion-row class="ion-justify-content-between">
            <ion-col size="auto"> </ion-col>
          </ion-row>
          <ion-row class="row-option ion-justify-content-start">
            <ion-col class="col-option" size="auto">
              <ion-label class="status-chip" [ngStyle]="{ 'background-color': menu.status === 'available' ? 'darkgreen' : 'rgba(236,73,19,1.00)', color: 'white' }" class="status-chip">{{
                menu.status === 'available' ? 'Disponible' : 'Indisponible'
              }}</ion-label>
            </ion-col>
          </ion-row>
        </ion-grid>
      </ion-col>
    </ion-row>
  </ion-grid>
</ion-col>
