<ion-item>
  <ion-infinite-scroll>
    <ion-grid>
      <app-marchand-header [name]="fastFood.fastfoodName"></app-marchand-header>

      <ion-row *ngIf="fastFood.menus?.length > 0" class="row-item">
        <app-item2 [menu]="menu" (click)="handleMenuClick(menu); showBottomCard('bottom-card-home')" *ngFor="let menu of fastFood.menus"></app-item2>
      </ion-row>
    </ion-grid>
  </ion-infinite-scroll>
</ion-item>
