<ion-item style="transition-duration: 800ms" (click)="onClick()">
  <ion-grid [attr.id]="idxToGet2" class="gridd" fixed [ngClass]="{ 'notif-highlight': selectedId === idxToGet2 }">
    <ion-row>
      <ion-col size="10">
        <ion-col class="col-icon" size="auto">
          <ion-icon class="iconNotif" name="{{iconn}}"></ion-icon>
        </ion-col>
        <ion-col size="10">
          <ion-grid fixed>
            <ion-row>
              <ion-col size="auto">
                <ion-label class="titreNotif">{{titre}}</ion-label>
              </ion-col>
              <ion-col class="col-heure" size="auto">
                <ion-label>{{date}}</ion-label>
              </ion-col>
            </ion-row>
            <ion-row class="ion-justify-content-between">
              <ion-col size="12">
                <ion-label [id]="'label'+idxToGet2" class="valNotif" [ngClass]="{ 'label-active': selectedId === idxToGet2 }">{{valeuNotif}} </ion-label>
              </ion-col>
            </ion-row>
          </ion-grid>
        </ion-col>
      </ion-col>
      <ion-col class="col-nbrNotif" size="2">
        <ion-label [ngStyle]="{ 'background-color': !isRead.includes(userId) ? 'rgba(236,73,19,1.00)' : 'transparent' }" class="nbrNotif">
          <!-- {{nbrNotif}} -->
        </ion-label>
      </ion-col>
    </ion-row>
  </ion-grid>
</ion-item>
